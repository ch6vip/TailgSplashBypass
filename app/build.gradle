plugins {
    id "com.android.application"
}

def maxVersionCode = 2_100_000_000
def moduleVersionName = providers.gradleProperty("moduleVersionName").get()
def moduleVersionCode

try {
    moduleVersionCode = Integer.parseInt(providers.gradleProperty("moduleVersionCode").get())
} catch (NumberFormatException e) {
    throw new GradleException("moduleVersionCode must be an integer", e)
}

if (moduleVersionCode < 1 || moduleVersionCode > maxVersionCode) {
    throw new GradleException("Invalid moduleVersionCode=${moduleVersionCode}. Valid range: 1..${maxVersionCode}")
}

def githubRefType = System.getenv("GITHUB_REF_TYPE")
def githubRefName = System.getenv("GITHUB_REF_NAME")
def releaseTagName = (githubRefType == "tag" && githubRefName != null && !githubRefName.trim().isEmpty())
        ? githubRefName.trim()
        : null

if (releaseTagName != null && releaseTagName != moduleVersionName) {
    throw new GradleException(
            "Release tag '${releaseTagName}' must match moduleVersionName '${moduleVersionName}'"
    )
}

def signingStoreFile = System.getenv("SIGNING_STORE_FILE")
def signingStorePassword = System.getenv("SIGNING_STORE_PASSWORD")
def signingKeyAlias = System.getenv("SIGNING_KEY_ALIAS")
def signingKeyPassword = System.getenv("SIGNING_KEY_PASSWORD")
def signingValues = [signingStoreFile, signingStorePassword, signingKeyAlias, signingKeyPassword]
def hasAnyReleaseSigning = signingValues.any { it != null && !it.trim().isEmpty() }
def hasReleaseSigning = signingValues.every { it != null && !it.trim().isEmpty() }

if (hasAnyReleaseSigning && !hasReleaseSigning) {
    throw new GradleException("Release signing requires all SIGNING_* environment variables")
}

android {
    namespace "com.tailg.lsposed.adblock"
    compileSdk 36

    defaultConfig {
        applicationId "com.tailg.lsposed.adblock"
        minSdk 26
        targetSdk 34
        versionCode moduleVersionCode
        versionName moduleVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            merges += "META-INF/xposed/*"
            excludes += "**"
        }
    }
}

dependencies {
    compileOnly "io.github.libxposed:api:101.0.1"
    implementation "com.tencent:mmkv:2.4.0"
    testImplementation "junit:junit:4.13.2"
}
